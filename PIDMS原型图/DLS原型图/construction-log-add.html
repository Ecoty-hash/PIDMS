    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <h1>企业管理系统</h1>
            </div>

                <div class="menu-item">

                    <span class="menu-title">施工管理</span>
                    <ul class="submenu">
                        <li><a href="progress-management.html">进度管理</a></li>
                        <li><a href="quality-inspection.html">质量检查</a></li>
                        <li><a href="quality-rectification.html">质量整改单</a></li>

                        <li><a href="safety-rectification.html">安全整改单</a></li>

                        <li><a href="customer.html">客户</a></li>
                        <li><a href="supplier.html">供应商</a></li>

                    </ul>
                </div>
                <div class="menu-item">
                    <span class="menu-title">系统管理</span>
                    <ul class="submenu">
                        <li><a href="personnel.html">人员管理</a></li>

                        <li><a href="role-management.html">角色管理</a></li>
                    </ul>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>施工管理 / 新增施工日志</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='construction-log.html'">返回</button>
                        <button class="btn primary" type="submit" form="logForm">保存</button>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                                <form id="logForm" class="form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>项目名称 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择项目</option>
                                <option value="1">墨西哥蒙特雷地铁6号线延长线项目</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>计划名称 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择计划名称</option>
                                <option value="1">设计与准备阶段</option>
                                <option value="2">施工阶段</option>
                                <option value="3">验收与运维阶段</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>日志日期 <span class="required">*</span></label>
                            <input type="date" required>
                        </div>
                        <div class="form-group">
                            <label>工作量 <span class="required">*</span></label>
                            <input type="number" placeholder="请输入工作量" required>
                        </div>
                        <div class="form-group">
                            <label>天气 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择天气</option>
                                <option value="sunny">晴</option>
                                <option value="cloudy">多云</option>
                                <option value="rainy">雨</option>
                                <option value="snowy">雪</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>施工部位 <span class="required">*</span></label>
                            <input type="text" placeholder="请输入施工部位" required>
                        </div>
                        <div class="form-group">
                            <label>施工内容 <span class="required">*</span></label>
                            <input type="text" placeholder="请输入施工内容" required>
                        </div>
                        <div class="form-group">
                            <label>出勤人数 <span class="required">*</span></label>
                            <input type="number" required>
                        </div>
                        <div class="form-group full-width">
                            <label>施工详情</label>
                            <textarea rows="4" placeholder="请输入施工详情"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>存在问题</label>
                            <textarea rows="4" placeholder="请输入存在问题"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>图片上传</label>
                            <div class="upload-area">
                                <input type="file" multiple accept="image/*">
                                <p>点击或拖拽上传图片</p>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn" onclick="window.location.href='construction-log.html'">取消</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('logForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'construction-log.html';
        });
    </script>
</body>
</html>
