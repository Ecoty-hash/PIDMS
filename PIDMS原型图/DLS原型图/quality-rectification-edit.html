        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>施工管理 / 编辑质量整改单</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='quality-rectification.html'">返回</button>
                    </div>
                </div>
            </header>
            
            <div class="content-wrapper"><div class="form-card">
                <form>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>项目名称 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择项目</option>
                                <option value="1" selected>墨西哥蒙特雷地铁6号线</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>整改单号</label>
                            <input type="text" placeholder="请输入整改单号" value="ZLZG-2025-001">
                        </div>
                        <div class="form-group">
                            <label>整改部位</label>
                            <input type="text" placeholder="请输入整改部位" value="主体结构">
                        </div>
                        <div class="form-group">
                            <label>要求完成日期 <span class="required">*</span></label>
                            <input type="date" value="2025-04-15" required>
                        </div>
                        <div class="form-group">
                            <label>整改状态</label>
                            <select>
                                <option value="">请选择</option>
                                <option value="pending">待整改</option>
                                <option value="inprogress">整改中</option>
                                <option value="completed" selected>已整改</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>整改内容</label>
                        <textarea placeholder="请输入整改内容">对主体结构存在的质量问题进行整改，已完成全部整改工作。</textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary">保存</button>
                        <button type="button" class="btn" onclick="window.location.href='quality-rectification.html'">取消</button>
                    </div>
                </form></div>
            </div>
