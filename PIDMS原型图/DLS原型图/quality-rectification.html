        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>施工管理 / 质量整改单</h2>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <input type="text" placeholder="输入关键字进行搜索">
                        <button>搜索</button>
                    </div>
                    <div class="header-buttons">
                        <button class="btn" onclick="toggleAdvancedSearch()">高级搜索</button>
                        <button class="btn">导出</button>
                        <button class="btn primary" onclick="window.location.href='quality-rectification-add.html'">+ 新增</button>
                    </div>
                </div>
            </header>

            <div class="advanced-search" id="advancedSearch" style="display: none;">
                <div class="search-fields">
                    <div class="search-field">
                        <label>项目名称</label>
                        <input type="text" placeholder="请输入项目名称">
                    </div>
                    <div class="search-field">
                        <label>整改状态</label>
                        <select>
                            <option value="">请选择</option>
                            <option value="待整改">待整改</option>
                            <option value="整改中">整改中</option>
                            <option value="已完工">已完工</option>
                        </select>
                    </div>
                    <div class="search-field">
                        <label>要求完成日期</label>
                        <input type="date">
                    </div>
                    <div class="search-field">
                        <label>创建人</label>
                        <input type="text" placeholder="请输入创建人">
                    </div>
                </div>
                <div class="search-actions">
                    <button class="btn primary">搜索</button>
                    <button class="btn" onclick="resetAdvancedSearch()">重置</button>
                </div>
            </div>

            <div class="content-wrapper">
                <div class="project-list">
                    <table class="project-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox"></th><th>项目名称</th><th>整改单号</th><th>整改部位</th><th>要求完成日期</th><th>整改状态</th><th>创建人</th><th>创建时间</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><input type="checkbox"></td><td>墨西哥蒙特雷地铁6号线</td><td>ZLZG-2025-001</td><td>主体结构</td><td>2025-04-15</td><td>已整改</td><td>赵六</td><td>2025-03-15</td><td>
                                    <a href="quality-rectification-edit.html" class="action-btn">编辑</a>
                                    <a href="quality-rectification-detail.html" class="action-btn">查看</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <div class="pagination-info">
                        <span>已选择 0 条</span>
                        <span>共 2 条</span>
                    </div>
                    <div class="pagination-buttons">
                        <select class="page-size-select">
                            <option>20条/页</option>
                            <option>50条/页</option>
                            <option>100条/页</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        function toggleAdvancedSearch() {
            var panel = document.getElementById('advancedSearch');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
        function resetAdvancedSearch() {
            var panel = document.getElementById('advancedSearch');
            panel.querySelectorAll('input').forEach(function(input) { input.value = ''; });
            panel.querySelectorAll('select').forEach(function(select) { select.selectedIndex = 0; });
        }
    </script>
</body>
