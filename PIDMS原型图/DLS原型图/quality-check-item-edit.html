                <div class="header-left">
                    <h2>基础管理 / 基础资料 / 编辑质量检查项</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='quality-check-item.html'">返回</button>
                        <button class="btn primary" type="submit" form="checkForm">保存</button>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <form id="checkForm" class="form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>未分类名称 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择未分类</option>
                                <option value="1">结构工程</option>
                                <option value="2" selected>装饰工程</option>
                                <option value="3">安装工程</option>
                                <option value="4">防水工程</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>检查项名称 <span class="required">*</span></label>
                            <input type="text" value="墙面平整度检查 required>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select>
                                <option value="active" selected>启用</option>
                                <option value="inactive">停用</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
        </main>

    <script src="script.js"></script>
    <script>
        document.getElementById('checkForm').addEventListener('submit', function(e) {
            e.preventDefault();
