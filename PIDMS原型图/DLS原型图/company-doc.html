        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>文档管理 / 公司文档</h2>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <input type="text" placeholder="输入关键字进行搜索">
                        <button>搜索</button>
                    </div>
                    <div class="header-buttons">
                        <button class="btn" onclick="toggleAdvancedSearch()">高级搜索</button>
                        <button class="btn">导出</button>
                        <button class="btn">导入</button>
                        <button class="btn primary" onclick="window.location.href='company-doc-add.html'">+ 新增</button>
                    </div>
                </div>
            </header>

            <div class="advanced-search" id="advancedSearch" style="display: none;">
                <div class="search-fields">
                    <div class="search-field">
                        <label>文档标题</label>
                        <input type="text" placeholder="请输入文档标题">
                    </div>
                    <div class="search-field">
                        <label>文档分类</label>
                        <select>
                            <option value="">请选择</option>
                            <option value="公司制度">公司制度</option>
                            <option value="技术规范">技术规范</option>
                            <option value="管理文件">管理文件</option>
                        </select>
                    </div>
                    <div class="search-field">
                        <label>发布日期</label>
                        <input type="date">
                    </div>
                    <div class="search-field">
                        <label>发布部门</label>
                        <input type="text" placeholder="请输入发布部门">
                    </div>
                </div>
                <div class="search-actions">
                    <button class="btn primary">搜索</button>
                    <button class="btn" onclick="resetAdvancedSearch()">重置</button>
                </div>
            </div>

            <div class="content-wrapper">
                <div class="project-list">
                    <table class="project-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox"></th><th>文档编号</th><th>文档名称</th><th>文档分类</th><th>版本号</th><th>上传人</th><th>上传时间</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
<tr>
                                <td><input type="checkbox"></td>
                                <td>WD-001</td>
                                <td>蒙特雷项目管理规范</td>
                                <td>管理制度</td>
                                <td>V1.0</td>
                                <td>系统管理员</td>
                                <td>2025-01-01</td>
                                <td>
                                    <a href="#" class="action-btn">下载</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination">
                    <div class="pagination-info">
                        <span>已选择 0 条</span>
                        <span>共 5 条</span>
                    </div>
                    <div class="pagination-buttons">
                        <select class="page-size-select">
                            <option>20条/页</option>
                            <option>50条/页</option>
                            <option>100条/页</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        function toggleAdvancedSearch() {
            var panel = document.getElementById('advancedSearch');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
        function resetAdvancedSearch() {
            var panel = document.getElementById('advancedSearch');
            panel.querySelectorAll('input').forEach(function(input) { input.value = ''; });
            panel.querySelectorAll('select').forEach(function(select) { select.selectedIndex = 0; });
        }
    </script>
</body>
