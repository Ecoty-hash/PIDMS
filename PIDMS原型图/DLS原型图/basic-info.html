<!DOCTYPE html>

    <title>基础管理 - 基础资料</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .basic-info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .basic-info-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            cursor: pointer;
            transition: all 0.3s;
        }
        .basic-info-item:hover {
            border-color: #1890ff;
            box-shadow: 0 2px 8px rgba(24, 144, 255, 0.1);
        }
        .info-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 16px;
        }
        .icon-red { background: #fff1f0; color: #ff4d4f; }
        .icon-green { background: #f6ffed; color: #52c41a; }
        .icon-orange { background: #fffbe6; color: #faad14; }
        .icon-blue { background: #e6f7ff; color: #1890ff; }
        .info-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .info-arrow {
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
