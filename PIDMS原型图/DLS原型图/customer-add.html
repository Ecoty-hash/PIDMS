        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>基础管理 / 客户管理 / 新增客户</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='customer.html'">返回</button>
                        <button class="btn primary" type="submit" form="customerForm">保存</button>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <form id="customerForm" class="form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>客户名称 <span class="required">*</span></label>
                            <input type="text" placeholder="请输入客户名单 " required>
                        </div>
                        <div class="form-group">
                            <label>客户类型 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择客户类型</option>
                                <option value="government">政府单位</option>
                                <option value="enterprise">企业客户</option>
                                <option value="state-owned">国企客户</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>联系人</label>
                            <input type="text" placeholder="请输入联系人">
                        </div>
                        <div class="form-group">
                            <label>联系电话</label>
                            <input type="tel" placeholder="请输入联系电">
                        </div>
                        <div class="form-group">
                            <label>办公地址</label>
                            <input type="text" placeholder="请输入办公地址">
                        </div>
                        <div class="form-group">
                            <label>发票抬头</label>
                            <input type="text" placeholder="请输入发票抬">
                        </div>
                        <div class="form-group">
                            <label>税号</label>
                            <input type="text" placeholder="请输入税">
                        </div>
                        <div class="form-group">
                            <label>地址</label>
                            <input type="text" placeholder="请输入地址">
                        </div>
                        <div class="form-group">
                            <label>电话</label>
                            <input type="tel" placeholder="请输入电">
                        </div>
                        <div class="form-group">
                            <label>开户行</label>
                            <input type="text" placeholder="请输入开户行">
                        </div>
                        <div class="form-group">
                            <label>银行卡号</label>
                            <input type="text" placeholder="请输入银行卡">
                        </div>
                        <div class="form-group full-width">
                            <label>备注</label>
                            <textarea rows="3" placeholder="请输入备注"></textarea>
                        </div>
                        <div class="form-group">
                            <label>图片</label>
                            <input type="file" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>附件</label>
                            <input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx">
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'customer.html';
        });
    </script>
</body>
