        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>施工管理 / 编辑进度</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='progress-management.html'">返回</button>
                    </div>
                </div>
            </header>
            
            <div class="content-wrapper"><div class="form-card">
                <form>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>项目名称 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择项目</option>
                                <option value="1">墨西哥蒙特雷地铁6号线延长线项目</option>
                                <option value="2" selected>墨西哥蒙特雷地铁4、6号线项目</option>
                                <option value="3">蒙特雷地铁6号线综合管网改造项目</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>进度名称 <span class="required">*</span></label>
                            <input type="text" placeholder="请输入进度名称" value="地下管网基础施工" required>
                        </div>
                        <div class="form-group">
                            <label>进度编号</label>
                            <input type="text" placeholder="请输入进度编号" value="JD-2025-001">
                        </div>
                        <div class="form-group">
                            <label>计划开始日期 <span class="required">*</span></label>
                            <input type="date" value="2025-02-01" required>
                        </div>
                        <div class="form-group">
                            <label>计划结束日期 <span class="required">*</span></label>
                            <input type="date" value="2025-04-30" required>
                        </div>
                        <div class="form-group">
                            <label>实际开始日期</label>
                            <input type="date" value="2025-02-05">
                        </div>
                        <div class="form-group">
                            <label>实际结束日期</label>
                            <input type="date">
                        </div>
                        <div class="form-group">
                            <label>完成百分比</label>
                            <input type="number" placeholder="请输入 0-100" min="0" max="100" value="75">
                        </div>
                        <div class="form-group">
                            <label>进度状态</label>
                            <select>
                                <option value="">请选择</option>
                                <option value="in-progress" selected>进行中</option>
                                <option value="completed">已完成</option>
                                <option value="delayed">延期</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea placeholder="请输入备注">由于近期雨水较多，地下管网基础施工进度受到影响，预计延期10天完成。</textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary">保存</button>
                        <button type="button" class="btn" onclick="window.location.href='progress-management.html'">取消</button>
                    </div>
                </form></div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
