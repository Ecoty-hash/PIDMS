        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>施工管理 / 编辑安全检查</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='safety-inspection.html'">返回</button>
                    </div>
                </div>
            </header>
            
            <div class="content-wrapper"><div class="form-card">
                <form>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>项目名称 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择项目</option>
                                <option value="1" selected>墨西哥蒙特雷地铁6号线</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>检查单号</label>
                            <input type="text" placeholder="请输入检查单号" value="AQJC-2025-001">
                        </div>
                        <div class="form-group">
                            <label>检查类型 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择</option>
                                <option value="safety" selected>安全检查</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>检查部门 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择</option>
                                <option value="1" selected>安全部</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>检查日期 <span class="required">*</span></label>
                            <input type="date" value="2025-03-12" required>
                        </div>
                        <div class="form-group">
                            <label>检查部位</label>
                            <input type="text" placeholder="请输入检查部位" value="施工现场">
                        </div>
                        <div class="form-group">
                            <label>检查结果 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择</option>
                                <option value="pass" selected>合格</option>
                                <option value="fail">不合格</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>检查详情</label>
                        <textarea placeholder="请输入检查详情">对蒙特雷地铁6号线施工现场进行安全检查，各项安全措施落实到位，检查合格。</textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary">保存</button>
                        <button type="button" class="btn" onclick="window.location.href='safety-inspection.html'">取消</button>
                    </div>
                </form></div>
            </div>
