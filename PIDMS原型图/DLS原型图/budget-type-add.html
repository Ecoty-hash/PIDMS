        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>基础管理 / 预算类型管理 / 新增预算类型</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='budget-type.html'">返回</button>
                        <button class="btn primary" type="submit" form="budgetTypeForm">保存</button>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <form id="budgetTypeForm" class="form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>预算类型 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择预算类型</option>
                                <option value="labor">人工费</option>
                                <option value="material">材料费</option>
                                <option value="equipment">设备费</option>
                                <option value="expense">管理费</option>
                                <option value="subcontract">分包费</option>
                                <option value="other">其他费用</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>二级预算类型 <span class="required">*</span></label>
                            <input type="text" placeholder="请输入二级预算类型" required>
                        </div>
                        <div class="form-group">
                            <label>二级预算类型编码 <span class="required">*</span></label>
                            <input type="text" placeholder="格式：XX-XX-XXX，如 RGF-GZ-001" required>
                        </div>
                        <div class="form-group">
                            <label>状态<span class="required">*</span></label>
                            <select required>
                                <option value="enabled" selected>启用</option>
                                <option value="sealed">封存</option>
                            </select>
                        </div>
                        <div class="form-group full-width">
                            <label>备注</label>
                            <textarea rows="3" placeholder="请输入备注"></textarea>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('budgetTypeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'budget-type.html';
