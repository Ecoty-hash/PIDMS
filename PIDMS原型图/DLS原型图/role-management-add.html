        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>系统管理 / 角色管理 / 新增</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='role-management.html'">返回</button>
                    </div>
                </div>
            </header>
            
            <div class="content-wrapper">
                <div class="form-card">
                    <form>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>角色名称 <span class="required">*</span></label>
                                <input type="text" placeholder="请输入角色名称" required>
                            </div>
                            <div class="form-group">
                                <label>角色编码 <span class="required">*</span></label>
                                <input type="text" placeholder="请输入角色编码" required>
                            </div>
                            <div class="form-group">
                                <label>状态</label>
                                <select>
                                    <option value="enabled" selected>启用</option>
                                    <option value="disabled">禁用</option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label>角色描述</label>
                                <textarea placeholder="请输入角色描述"></textarea>
                            </div>
                            <div class="form-group full-width">
                                <label>权限设置</label>
                                <div class="permission-tree">
                                    <div class="permission-group">
                                        <div class="permission-header">
                                            <label><input type="checkbox"> 项目管理</label>
                                        </div>
                                        <div class="permission-items">
                                            <label><input type="checkbox"> 项目</label>
                                            <label><input type="checkbox"> 用印申请</label>
                                        </div>
                                    </div>
                                    <div class="permission-group">
                                        <div class="permission-header">
                                            <label><input type="checkbox"> 施工管理</label>
                                        </div>
                                        <div class="permission-items">
                                            <label><input type="checkbox"> 进度管理</label>
                                            <label><input type="checkbox"> 质量检查</label>
                                            <label><input type="checkbox"> 质量整改单</label>
                                            <label><input type="checkbox"> 安全检查</label>
                                            <label><input type="checkbox"> 安全整改单</label>
                                            <label><input type="checkbox"> 施工日志</label>
                                            <label><input type="checkbox"> 可视化管理</label>
                                            <label><input type="checkbox"> 预警规则</label>
                                        </div>
                                    </div>
                                    <div class="permission-group">
                                        <div class="permission-header">
                                            <label><input type="checkbox"> 基础管理</label>
                                        </div>
                                        <div class="permission-items">
                                            <label><input type="checkbox"> 基础资料</label>
                                            <label><input type="checkbox"> 客户</label>
                                            <label><input type="checkbox"> 供应商</label>
                                            <label><input type="checkbox"> 内部单位</label>
                                        </div>
                                    </div>
                                    <div class="permission-group">
                                        <div class="permission-header">
                                            <label><input type="checkbox"> 系统管理</label>
                                        </div>
                                        <div class="permission-items">
                                            <label><input type="checkbox"> 人员管理</label>
                                            <label><input type="checkbox"> 机构管理</label>
                                            <label><input type="checkbox"> 角色管理</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group full-width">
                                <label>用户分配</label>
                                <div class="user-assignment-tree">
                                    <div class="search-box small">
                                        <input type="text" placeholder="搜索用户">
                                        <button>搜索</button>
                                    </div>
                                    <div class="user-tree-list">
                                        <div class="user-tree-item">
                                            <label><input type="checkbox"> 张文琦 (GM2025001) - 项目三部</label>
                                        </div>
                                        <div class="user-tree-item">
                                            <label><input type="checkbox"> 赵六 (GM2025002) - 技术部</label>
                                        </div>
                                        <div class="user-tree-item">
                                            <label><input type="checkbox"> 王五 (GM2025003) - 综合管理部</label>
                                        </div>
                                        <div class="user-tree-item">
                                            <label><input type="checkbox"> 李七 (GM2025004) - 项目三部</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn primary">确定</button>
                            <button type="button" class="btn" onclick="window.location.href='role-management.html'">取消</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        document.querySelectorAll('.permission-header input').forEach(function(parentCheckbox) {
            parentCheckbox.addEventListener('change', function() {
                var group = this.closest('.permission-group');
                var childCheckboxes = group.querySelectorAll('.permission-items input');
                childCheckboxes.forEach(function(child) {
                    child.checked = parentCheckbox.checked;
                });
            });
        });

        document.querySelectorAll('.permission-items input').forEach(function(childCheckbox) {
            childCheckbox.addEventListener('change', function() {
                var group = this.closest('.permission-group');
                var parentCheckbox = group.querySelector('.permission-header input');
                var childCheckboxes = group.querySelectorAll('.permission-items input');
                var allChecked = Array.from(childCheckboxes).every(function(cb) { return cb.checked; });
                parentCheckbox.checked = allChecked;
            });
        });
    </script>
</body>
</html>
