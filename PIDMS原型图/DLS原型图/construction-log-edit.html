        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>施工管理 / 编辑施工日志</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='construction-log.html'">返回</button>
                    </div>
                </div>
            </header>
            
            <div class="content-wrapper"><div class="form-card">
                <form>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>项目名称 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择项目</option>
                                <option value="1" selected>墨西哥蒙特雷地铁6号线</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>日志日期 <span class="required">*</span></label>
                            <input type="date" value="2025-02-15" required>
                        </div>
                        <div class="form-group">
                            <label>天气 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择天气</option>
                                <option value="sunny" selected>晴</option>
                                <option value="cloudy">多云</option>
                                <option value="rainy">雨</option>
                                <option value="snowy">雪</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>施工部位 <span class="required">*</span></label>
                            <input type="text" placeholder="请输入施工部位" value="地下管网基础" required>
                        </div>
                        <div class="form-group">
                            <label>施工内容 <span class="required">*</span></label>
                            <input type="text" placeholder="请输入施工内容" value="管网基础开挖、管道铺设" required>
                        </div>
                        <div class="form-group">
                            <label>出勤人数 <span class="required">*</span></label>
                            <input type="number" value="25" required>
                        </div>
                        <div class="form-group full-width">
                            <label>施工详情</label>
                            <textarea rows="4">今日主要进行地下管网基础开挖及管道铺设工作，施工进展顺利，完成计划进度的95%。</textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>存在问题</label>
                            <textarea rows="4">局部区域遇到硬岩层，开挖进度受影响，已调整施工方案。</textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>图片上传</label>
                            <div class="upload-area">
                                <input type="file" multiple accept="image/*">
                                <p>点击或拖拽上传图片</p>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary">保存</button>
                        <button type="button" class="btn" onclick="window.location.href='construction-log.html'">取消</button>
                    </div>
                </form></div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
