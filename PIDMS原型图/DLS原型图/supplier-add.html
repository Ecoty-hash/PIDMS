        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h2>基础管理 / 供应商</ 新增供应商</h2>
                </div>
                <div class="header-right">
                    <div class="header-buttons">
                        <button class="btn" onclick="window.location.href='supplier.html'">返回</button>
                        <button class="btn primary" type="submit" form="supplierForm">保存</button>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <form id="supplierForm" class="form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>供应商名称<span class="required">*</span></label>
                            <input type="text" placeholder="请输入供应商名称" required>
                        </div>
                        <div class="form-group">
                            <label>供应商类型 <span class="required">*</span></label>
                            <select required>
                                <option value="">请选择供应商类型</option>
                                <option value="material">材料供应商</option>
                                <option value="equipment">设备供应商</option>
                                <option value="labor">劳务分包</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>联系人</label>
                            <input type="text" placeholder="请输入联系人">
                        </div>
                        <div class="form-group">
                            <label>联系电话</label>
                            <input type="tel" placeholder="请输入联系电">
                        </div>
                        <div class="form-group">
                            <label>报价人</label>
                            <input type="text" placeholder="请输入报价人">
                        </div>
                        <div class="form-group">
                            <label>报价人手机</label>
                            <input type="tel" placeholder="请输入报价手机号">
                        </div>
                        <div class="form-group full-width">
                            <label>办公地址</label>
                            <input type="text" placeholder="请输入办公地址">
                        </div>
                    </div>

                    <h3 style="margin: 20px 0 15px; padding-top: 15px; border-top: 1px solid #eee;">银行信息</h3>
                    <div id="bankInfoContainer">
                        <div class="form-grid bank-info-item" style="position: relative; margin-bottom: 15px; padding: 15px; background: #fafafa; border-radius: 4px;">
                            <div class="form-group">
                                <label>户名</label>
                                <input type="text" placeholder="请输入户">
                            </div>
                            <div class="form-group">
                                <label>开户行</label>
                                <input type="text" placeholder="请输入开户行">
                            </div>
                            <div class="form-group">
                                <label>银行卡号</label>
                                <input type="text" placeholder="请输入银行卡">
                            </div>
                            <div class="form-group">
                                <span class="form-caption">操作</span>
                                <div style="display: flex; gap: 10px; margin-top: 8px;">
                                    <button type="button" class="btn secondary" onclick="copyBankInfo(this)">复制</button>
                                    <button type="button" class="btn danger" onclick="removeBankInfo(this)">删除</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn secondary" onclick="addBankInfo()" style="margin-top: 10px;">+ 添加银行信息</button>

                    <h3 style="margin: 20px 0 15px; padding-top: 15px; border-top: 1px solid #eee;">其他信息</h3>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>备注</label>
                            <textarea rows="3" placeholder="请输入备注"></textarea>
                        </div>
                        <div class="form-group">
                            <label>图片</label>
                            <input type="file" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>附件</label>
                            <input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx">
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
    <script>
        document.getElementById('supplierForm').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'supplier.html';
        });

        function addBankInfo() {
            const container = document.getElementById('bankInfoContainer');
            const newItem = document.createElement('div');
            newItem.className = 'form-grid bank-info-item';
            newItem.style.cssText = 'position: relative; margin-bottom: 15px; padding: 15px; background: #fafafa; border-radius: 4px;';
            newItem.innerHTML = `
                <div class="form-group">
                    <label>户名</label>
                    <input type="text" placeholder="请输入户">
                </div>
                <div class="form-group">
                    <label>开户行</label>
                    <input type="text" placeholder="请输入开户行">
                </div>
                <div class="form-group">
                    <label>银行卡号</label>
                    <input type="text" placeholder="请输入银行卡">
                </div>
                <div class="form-group">
                    <span class="form-caption">操作</span>
                    <div style="display: flex; gap: 10px; margin-top: 8px;">
                        <button type="button" class="btn secondary" onclick="copyBankInfo(this)">复制</button>
                        <button type="button" class="btn danger" onclick="removeBankInfo(this)">删除</button>
                    </div>
                </div>
            `;
            container.appendChild(newItem);
        }

        function removeBankInfo(btn) {
            const item = btn.closest('.bank-info-item');
            if (document.querySelectorAll('.bank-info-item').length > 1) {
                item.remove();
            }
        }

        function copyBankInfo(btn) {
            const item = btn.closest('.bank-info-item');
            const inputs = item.querySelectorAll('input');
            const data = Array.from(inputs).map(input => input.value).join(', ');
            navigator.clipboard.writeText(data).then(() => {
                alert('银行信息已复制到剪贴板');
            });
        }
    </script>
</body>
